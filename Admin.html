<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>     Admin Review</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="Admin.css">
</head>
<body class="admin-page">
 
    <nav class="nav" id="nav">
        <div class="nav-inner">
            <a href="main.html" class="nav-brand">Ri<span>Cap</span></a>
            <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="navLinks" data-nav-toggle>
                <span></span><span></span><span></span>
            </button>
            <ul class="nav-links" id="navLinks">
                <li><a href="Home.html">Home</a></li>
                <li><a href="mapping.html">Mapping</a></li>
                <li><a href="Image_Processing.html">Scanner</a></li>
                <li><a href="Tracking.html">Tracking</a></li>
                <li><a href="main.html#loginbutton">Login</a></li>
                <li><a href="Verify.html">Verify</a></li>
                <li data-admin-only hidden><a href="Admin.html" class="nav-link--active" aria-current="page">Admin</a></li>
                <li data-admin-only hidden><a href="maintenance.html">Maintenance</a></li>
            </ul>
        </div>
    </nav>

    <main class="page-main">
        <div class="page-shell">

            <section class="access-gate" id="adminGate">
                <p class="eyebrow">Admin</p>
                <h1 class="gate-title">Sign in to review applications</h1>
                <p class="gate-copy">Restricted to RiCap admin accounts created in Firebase Authentication.</p>

                <form id="adminLoginForm" class="access-form" autocomplete="off">
                    <label for="adminEmail">Email</label>
                    <input type="email" id="adminEmail" required>
                    <label for="adminPassword">Password</label>
                    <input type="password" id="adminPassword" required>
                    <button type="submit">Sign in</button>
                </form>
                <p class="access-error" id="adminLoginError" hidden></p>
            </section>

            <section id="adminPanel" hidden>
                <header class="admin-head">
                    <p class="eyebrow">Signed in as <span id="adminEmailLabel"></span> · <button type="button" id="adminSignOutBtn" class="link-btn">sign out</button></p>
                    <h1 class="admin-title">Pending Applications</h1>
                </header>
                <p class="admin-empty" id="adminEmptyState">No pending applications right now.</p>

                <div class="app-list" id="appList"></div>
            </section>

        </div>
    </main>

    <script type="module" src="Admin.js"></script>
    <script type="module" src="admin-nav.js"></script>
</body>
</html>
